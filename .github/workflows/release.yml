name: Release

# Tag-driven. Matches v* AND V*: a tag once pushed as V1.0.8 matched neither pattern in
# another repository, and that release shipped with no PDF attached.
#   git tag -a v0.1.0 -m "A1" && git push origin v0.1.0
# Release jobs stay on GitHub-hosted runners (they hold the only write permission).

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for'
        required: true

permissions:
  contents: read

env:
  PDF_NAME: Deutsch-von-Null-bis-B2

jobs:
  build:
    name: Compile PDF and Anki decks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Source gates
        run: |
          python3 tools/gen.py --check
          python3 tools/check_book.py
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Refuse to release a broken log
        run: python3 tools/check_log.py main.log
      - name: Name the artefacts
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp main.pdf "dist/${PDF_NAME}-${TAG}.pdf"
          cp main.pdf "dist/${PDF_NAME}.pdf"
          (cd anki && zip -q ../dist/anki-decks.zip german-*.tsv)
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/*

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            *.pdf
            anki-decks.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Draft build of *Deutsch von Null bis B2*. Not reviewed by a native speaker;
            facts marked [?] need a primary source (see the ledgers appendix).
