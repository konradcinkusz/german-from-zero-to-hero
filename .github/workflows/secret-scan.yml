name: Secret Scan

# The CI half of a two-part control (pre-commit is the other half).
# Image is :latest on purpose: a pinned detection ruleset silently stops detecting
# whatever was added upstream last month. Everything else here is pinned.

on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret added and removed earlier on the branch is still in history.
          fetch-depth: 0
      - name: Scan
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/gitleaks/gitleaks:latest"
          if docker run --rm "$IMAGE" git --help >/dev/null 2>&1; then SUB=(git /repo); else SUB=(detect --source=/repo); fi
          docker run --rm -v "$PWD:/repo" -w /repo "$IMAGE" "${SUB[@]}" \
            --config=/repo/.gitleaks.toml --redact --no-banner --verbose --exit-code 1
      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo "This repository is public. Rotate the credential FIRST, then remove it, then clean history."
          } >> "$GITHUB_STEP_SUMMARY"
